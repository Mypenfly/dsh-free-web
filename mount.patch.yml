# dsh-free-web — manual mount overlay (no bundle install).
#
# The package itself is a bundle: `dsh.bundle.patch` points at ./cordis.patch.yml, so an
# installed profile needs nothing from this file. This overlay is for setups that keep
# plugins as file paths (a `--patch` overlay, an agent preset, a profile without the
# package as a dependency): it mounts the module by absolute path, and the row is then
# invisible to the Plugins page.
#
# Rollback = delete these two entries; the seam falls back to
# `searchProvider: deepseek-official` / `fetchProvider: http` from @deepseek-ai/dsh-base.

- insert:
    - id: free-web
      name: /abs/path/to/dsh-free-web/src/index.mjs
      config:
        engines: [duckduckgo, yahoojp, so360, sogou, wikipedia]
        # provenance: true      # prefix results with "Engines: …"
        # engineTimeoutMs: 8000
        # verbose: true         # one stderr line per registered provider

# The `web` row is declared by @deepseek-ai/dsh-base; re-point it at the ids above.
# A later `- id: web` entry (or the Web-search settings page) overrides this one.
- id: web
  config:
    searchProvider: free-search
    fetchProvider: free-fetch
