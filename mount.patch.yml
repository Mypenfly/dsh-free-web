# dsh-free-web mount block — append to the profile patch that already carries your rows
# (~/.dsh/profiles/desktop/cordis.patch.yml for the desktop app), or pass as `dsh --patch mount.patch.yml`.
#
# Rollback = delete these two entries. The seam then falls back to
# `searchProvider: deepseek-official` / `fetchProvider: http` from @deepseek-ai/dsh-base.

- insert:
    - id: free-web
      name: /home/mypenfly/projects/dsh-plugins/free-web/src/index.mjs
      config:
        engines: [duckduckgo, yahoojp, so360, sogou, wikipedia]
        # provenance: true      # prefix results with "Engines: …"
        # engineTimeoutMs: 8000
        # verbose: true         # one stderr line per registered provider

# The `web` row is declared by @deepseek-ai/dsh-base; re-point it at the ids above.
# A later `- id: web` entry (or the Web-search settings page) overrides this one.
- id: web
  config:
    searchProvider: free-search
    fetchProvider: free-fetch
